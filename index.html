<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Trainers</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        h1 {
            margin: 0 0 15px 0;
            font-size: 1.8em;
        }
        
        p {
            margin: 0 0 25px 0;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 18px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button:disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
        }

        #desktopBtn {
            margin-top: 10px;
            background: #102c36;
            color: white;
        }
        
        #status {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 15px;
        }
        
        .version {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #desktopControls[hidden], #eyeLabels[hidden], #eyeDivider[hidden] {
            display: none;
        }

        #desktopControls {
            position: fixed;
            z-index: 50;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 18px;
            background: rgba(8, 20, 24, 0.94);
            color: white;
            font-size: 14px;
        }

        #desktopControls button {
            flex: 0 0 auto;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        #eyeLabels {
            position: fixed;
            z-index: 20;
            top: 12px;
            left: 0;
            right: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            pointer-events: none;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }

        #eyeLabels span:first-child {
            justify-self: start;
            margin-left: 12px;
            padding: 5px 8px;
            background: rgba(160, 46, 46, 0.85);
        }

        #eyeLabels span:last-child {
            justify-self: end;
            margin-right: 12px;
            padding: 5px 8px;
            background: rgba(39, 115, 128, 0.9);
        }

        #eyeDivider {
            position: fixed;
            z-index: 30;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            background: rgba(235, 241, 235, 0.9);
            pointer-events: none;
        }

        @media (max-width: 700px) {
            #desktopControls {
                align-items: flex-start;
                font-size: 12px;
            }

            #desktopControls button {
                padding: 8px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>🥽 WebXR Trainers</h1>
        <p>
            Запустите VR или stereo preview.<br>
            Тренажёр можно выбрать в меню.
        </p>

        <button id="startBtn">Запустить VR</button>
        <br>
        <button id="desktopBtn">Открыть stereo preview</button>
        <div id="status">Готово к запуску</div>
        <div class="version">Build: <span id="buildVersion">...</span></div>
    </div>
    
    <canvas id="glCanvas"></canvas>
    <div id="eyeLabels" hidden><span>LEFT EYE</span><span>RIGHT EYE</span></div>
    <div id="eyeDivider" hidden aria-hidden="true"></div>
    <div id="desktopControls" hidden>
        <span>Мышь: наводка / клик: триггер · WASD: левый стик · стрелки: правый стик · Q: grip · Space: A/trigger · X/Y: кнопки</span>
        <button id="desktopExitBtn" type="button">Выйти</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/base.js"></script>
    <script src="js/input-adapters.js"></script>
    <script src="js/trainer-registry.js"></script>
    <script src="js/render-modes.js"></script>
    <script src="js/runtime.js"></script>
    <script src="js/trainers/binocular.js"></script>
    <script src="js/trainers/blockbreaker.js"></script>
    <script src="js/trainers/trajectory.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
